  - name: "FOps Repayment workbook"
    ref: "gsheet:1VRWk9og…"
    covers: [repayment.kpi]
    status: golden
    evidence: "93 references across docs — the single most-cited artifact. Weekly submission/collection/district detail; quoted in every Systems meeting repayment section."
    caveat: "Field-reported basis; known gaps vs bank (−9.69% MM) and vs system."

  - name: "26B Distribution — Rapport de Synchronisation"
    ref: "gsheet:1tdfWbW-…"
    covers: [distribution.synchronisation]
    status: golden
    evidence: "61 references; the standing table (Log vs synchronised value) reproduced weekly in Systems notes."

  - name: "26B Fiche de collecte des KPIs (SFD weekly)"
    ref: "gsheet:15ag4YTt…"
    covers: [field KPIs: GL attendance, member visits, 100% repayment by group/member, cash-in-hand, electronic pending]
    status: golden
    evidence: "60 references; the defined weekly field collection instrument with enumerated KPI list."
    caveat: "Self-reported; minutes flag districts whose percentages 'do not correspond to reality'."

  - name: "26A claims consolidated dashboard"
    ref: "gsheet:1c3A8Odp… + dss:BURUNDI_BIZOPS:26A_claims_correction_with_status"
    covers: [claim counts, claims-vs-underpayment, correction progress]
    status: golden
    evidence: "'The AppSheet and Kobo claims databases have now been consolidated into a single dashboard claims table with one row per claim' (May 27); progress % quoted from it in leadership meetings."

  - name: "Crédit & Underpayment dashboards (25B, 26A)"
    ref: "dss:BURUNDI_BIZOPS:rY10PA8_25B / dss:BURUNDI_BIZOPS_CDM:hG3RiLq_26A"
    covers: [credit.system, underpayment (post-correction, post-offset)]
    status: golden
    evidence: "Headline numbers in every BizOps update are read from these."
    caveat: "BURUNDI_BIZOPS_CDM is outside the current agent API-key scope; dashboard basis ≠ raw dataset basis."

  - name: "KPIs Enregistrement 27A"
    ref: "gsheet:1W7DduyX…"
    covers: [enrolment.members, order vs target]
    status: golden
    evidence: "'611k members confirmed in the KPI after FD review' — FD review is the governance step; product target tables sourced from it."

  - name: "27A Enregistrement — Rapport de Synchronisation"
    ref: "gsheet:13Sujj1P…"
    covers: [enrolment.synchronisation]
    status: golden
    evidence: "23 references; the tracker FDs are instructed to use."

  - name: "V_FINERACT_COMBINED_TRANSACTIONS(_BI)"
    ref: "Snowflake PRODUCTION.LOANS.…"
    covers: [repayment.system raw]
    status: disputed
    evidence: "The system source — but Jul 15 analysis shows reversed-flag/TREF traps; Jun 15 filter change moved 1.5Bn; Ulrich formally recommends building ONE validated repayment dataset on top. Raw table is golden-source input, not a reporting surface."

  - name: "26B credit comparison (Log/KPI/Synch)"
    ref: "gsheet:1wltYpUY… + dss:BURUNDI_BIZOPS:Comparaison_Credit26B + dss:BURUNDI_BIZOPS_26B:26B_repayment_summary_by_account"
    covers: [credit perspectives, 26B]
    status: disputed
    evidence: "Aug 5 three-way table with 0.2% spread; FOps ruling 'KPI and Synched to be considered for now' — explicitly provisional."

  - name: "burundi_claims_repository (AppSheet PG)"
    ref: "dss:BURUNDI_BIZOPS:burundi_claims_repository → public.burundi_bizops_fo_claims"
    covers: [claim, 26A facture + 26B distribution campaigns]
    status: candidate
    evidence: "Normalised one-row-per-claim store (profiled 2026-08-06: 75,707 claims); but 26B claims SSOT is explicitly unresolved (Aug 5) and status column is submission-only."

  - name: "26B delivery data cleaning / Total_Distributed_Report"
    ref: "gsheet:1wltYpUY…"
    covers: [distribution.log, SAP vs Kobo accuracy]
    status: candidate
    evidence: "LOG's item-level accuracy reporting surface (82% → improving); explicit tabs (Smart_Variances, Reconciliation_Output)."

  - name: "26A_Credit_DistrRepaymentMultiS (DSS)"
    ref: "dss:BURUNDI_BIZOPS:26A_Credit_DistrRepaymentMultiS"
    covers: [credit+repayment per farmer, 26A]
    status: candidate
    evidence: "Profiled and verified in the measure glossary (grain trap documented); not itself cited in meetings — the dashboards built on it are."

  - name: "27AENROLLMENT project"
    ref: "dss:27AENROLLMENT"
    status: deprecated
    evidence: "Merged into BURUNDI_27A_ENROLMENT and archived (Jun 24, BC note) — duplicate project resolution."

  - name: "AppSheet (as a data platform)"
    status: deprecated
    evidence: "'AppSheet ramp-down' decision doc (Jun 3); Google-Sheets backends kept only until successors land."
