[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataiku-mcp"
version = "0.1.0"
description = "MCP tool suite for Dataiku DSS integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dataiku-api-client==14.0.0",
    # mcp 2.0 removed `mcp.server.fastmcp`, which server.py imports.
    # Keep this bounded until the server is ported to the 2.x API.
    "mcp>=1.2,<2",
    "pydantic>=2.0.0",
    "python-dotenv",
    "pyyaml>=6.0",
    "requests",
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "ruff",
]

[project.scripts]
dataiku-mcp-server = "dataiku_mcp.cli:main"

# Be explicit about what ships. Flat-layout auto-discovery silently drops
# directories named scripts/, tests/, docs/ ... which previously left the
# console script pointing at an uninstalled module.
[tool.setuptools.packages.find]
include = ["dataiku_mcp*"]
namespaces = false

[tool.black]
line-length = 80
target-version = ['py311']

[tool.ruff]
line-length = 80
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]