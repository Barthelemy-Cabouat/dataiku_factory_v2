[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataiku-mcp"
version = "0.1.0"
description = "MCP tool suite for Dataiku DSS integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # >=14.7: the agents API (DSSProject.list_agents / get_agent) that
    # tools/agents.py depends on first appears in the 14.7 client line.
    "dataiku-api-client>=14.7,<15",
    # mcp 2.0 removed `mcp.server.fastmcp`, which server.py imports.
    # Keep this bounded until the server is ported to the 2.x API.
    "mcp>=1.2,<2",
    "pydantic>=2.0.0",
    "python-dotenv",
    "pyyaml>=6.0",
    "requests",
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "ruff",
]

[project.scripts]
dataiku-mcp-server = "dataiku_mcp.cli:main"

# Be explicit about what ships. Flat-layout auto-discovery silently drops
# directories named scripts/, tests/, docs/ ... which previously left the
# console script pointing at an uninstalled module.
[tool.setuptools.packages.find]
include = ["dataiku_mcp*"]
namespaces = false

# The glossary is data, not code, so setuptools will not pick it up on its own.
# Without this the package installs and imports fine and lookup_concept simply
# returns an empty glossary -- a silent failure, so keep these in step whenever
# a new context file type is added.
[tool.setuptools.package-data]
dataiku_mcp = ["context/*.md"]

[tool.black]
line-length = 80
target-version = ['py311']

[tool.ruff]
line-length = 80
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]